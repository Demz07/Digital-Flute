<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Digital Flute — play a flute in your browser. Free play, guided songs, and demo playback." />
    <meta name="theme-color" content="#111318" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Digital Flute</title>
    <style>
      :root {
        --bg: #111318;
        --surface: #1b1e26;
        --border: #2c313d;
        --accent: #38bdf8;
        --target: #f59e0b;
        --danger: #f87171;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --tube: linear-gradient(
          90deg,
          #64748b 0%,
          #cbd5e1 35%,
          #e2e8f0 50%,
          #94a3b8 80%,
          #475569 100%
        );
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        display: flex;
        flex-direction: column;
      }

      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .title {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .top-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 0.85rem;
        max-width: 195px;
      }

      .volume {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .volume input[type="range"] {
        width: 90px;
        accent-color: var(--accent);
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 30px;
        gap: 8px;
      }

      .status-text {
        font-size: 0.88rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status-text strong {
        color: var(--target);
        font-size: 1rem;
        margin-right: 6px;
      }

      .status-text.free strong {
        color: var(--accent);
      }

      .status-text.wrong {
        color: var(--danger);
      }

      .status-text.wrong strong {
        color: var(--danger);
      }

      .controls {
        display: none;
        gap: 6px;
        flex-shrink: 0;
      }

      .controls.visible {
        display: flex;
      }

      button {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 11px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }

      button.active {
        background: var(--accent);
        color: #082f49;
        border-color: var(--accent);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px 0;
        min-height: 0;
        overflow-y: auto;
      }

      .flute {
        background: var(--tube);
        width: 74px;
        height: min(96%, 680px);
        border-radius: 37px;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        padding: 14px 0;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .hole {
        /* Holes are <button>s (keyboard/screen-reader accessible). */
        flex: 1 1 auto;
        width: 48px;
        max-height: 48px;
        min-height: 28px;
        border-radius: 50%;
        background: #111318;
        border: 3px solid #475569;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        touch-action: none;
        transition:
          transform 0.06s ease,
          border-color 0.1s ease,
          background-color 0.1s ease;
      }

      .hole span {
        font-size: 0.85rem;
        font-weight: 700;
        color: #94a3b8;
        pointer-events: none;
      }

      .hole.pressed {
        transform: scale(0.92);
        background: #0c4a6e;
        border-color: var(--accent);
      }

      .hole.pressed span {
        color: #ffffff;
      }

      .hole.target {
        border-color: var(--target);
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.55);
      }

      .hole.target span {
        color: var(--target);
      }

      .hint {
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
        padding: 4px 8px 8px;
      }

      /* Short / landscape screens: shrink holes instead of clipping. */
      @media (max-height: 600px), (orientation: landscape) and (max-height: 500px) {
        header {
          padding: 6px 10px;
          gap: 4px;
        }
        .flute {
          width: 60px;
          padding: 8px 0;
        }
        .hole {
          width: 38px;
          max-height: 38px;
          min-height: 22px;
          border-width: 2px;
        }
        .hole span {
          font-size: 0.7rem;
        }
        .hint {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hole {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="top-bar">
        <div class="title">Digital Flute</div>
        <div class="top-controls">
          <label class="volume" for="volume">
            Volume
            <input id="volume" type="range" min="0" max="100" value="65" />
          </label>
          <select id="songSelect" aria-label="Select preset">
            <option value="free">Free Play (Default)</option>
            <option value="rickroll">Never Gonna Give You Up</option>
            <option value="twinkle">Twinkle Twinkle</option>
            <option value="brahms">Brahms Lullaby</option>
            <option value="ode">Ode to Joy</option>
          </select>
        </div>
      </div>

      <div class="status-bar">
        <div class="status-text free" id="statusText" role="status" aria-live="polite">Free Play</div>
        <div class="controls" id="songControls">
          <button id="demoBtn" type="button">Demo</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
      </div>
    </header>

    <main>
      <div class="flute" id="flute" role="group" aria-label="Flute holes. Use keys A S D F G H J K L semicolon, bottom to top."></div>
    </main>
    <p class="hint">Keys (bottom → top): A S D F G H J K L ; &nbsp;·&nbsp; Touch / drag across holes to play</p>

    <script src="flute-core.js"></script>
    <script>
      "use strict";
      const { NOTES, SONGS, AUDIO, validateSongs, createSongTracker } = window.FluteCore;

      // --- Validate song data at startup (fail loudly, not silently) ---
      const songErrors = validateSongs(NOTES, SONGS);
      if (songErrors.length) console.error("[Digital Flute] Invalid song data:", songErrors);

      // --- DOM ---
      const fluteEl = document.getElementById("flute");
      const songSelect = document.getElementById("songSelect");
      const statusText = document.getElementById("statusText");
      const songControls = document.getElementById("songControls");
      const demoBtn = document.getElementById("demoBtn");
      const resetBtn = document.getElementById("resetBtn");
      const volumeInput = document.getElementById("volume");

      // Keyboard map: bottom (C4) -> top (E5)
      const KEY_FOR_NOTE = { C4: "a", D4: "s", E4: "d", F4: "f", G4: "g", A4: "h", B4: "j", C5: "k", D5: "l", E5: ";" };
      const NOTE_FOR_KEY = Object.fromEntries(Object.entries(KEY_FOR_NOTE).map(([n, k]) => [k, n]));

      // Build holes from the single source of truth (NOTES).
      NOTES.forEach(({ note, freq }) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "hole";
        btn.dataset.note = note;
        btn.dataset.freq = String(freq);
        btn.setAttribute("aria-label", `${note} hole, key ${KEY_FOR_NOTE[note]}`);
        const span = document.createElement("span");
        span.textContent = note;
        btn.appendChild(span);
        fluteEl.appendChild(btn);
      });
      const holes = Array.from(fluteEl.querySelectorAll(".hole"));

      // --- Audio ---
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      let ctx = null;
      let masterGain = null;
      let noiseBuffer = null;
      let volume = AUDIO.masterGain;

      async function ensureAudio() {
        if (!AudioCtor) throw new Error("Web Audio API is not supported in this browser.");
        if (!ctx) {
          ctx = new AudioCtor();
          const compressor = ctx.createDynamicsCompressor();
          compressor.threshold.value = AUDIO.compressor.threshold;
          compressor.knee.value = AUDIO.compressor.knee;
          compressor.ratio.value = AUDIO.compressor.ratio;
          compressor.attack.value = AUDIO.compressor.attack;
          compressor.release.value = AUDIO.compressor.release;
          compressor.connect(ctx.destination);

          masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(volume, ctx.currentTime);
          masterGain.connect(compressor);

          const bufferSize = Math.floor(ctx.sampleRate * AUDIO.noiseBufferSeconds);
          noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.969 * b2 + white * 0.153852;
            data[i] = (b0 + b1 + b2) * 0.07;
          }
          // Crossfade loop point so the 2s loop does not click.
          const fade = Math.floor(ctx.sampleRate * AUDIO.noiseCrossfadeSeconds);
          for (let i = 0; i < fade; i++) {
            const t = i / fade;
            data[i] = data[i] * t + data[bufferSize - fade + i] * (1 - t);
          }
        }
        if (ctx.state !== "running") await ctx.resume();
        return ctx;
      }

      class FluteVoice {
        constructor(freq, startTime) {
          if (!ctx) throw new Error("AudioContext not initialised");
          const now = typeof startTime === "number" ? startTime : ctx.currentTime;
          this.stopped = false;
          this._disconnected = false;
          this._startTime = now;

          this.osc1 = ctx.createOscillator();
          this.osc1.type = "sine";
          this.osc1.frequency.setValueAtTime(freq, now);

          this.osc2 = ctx.createOscillator();
          this.osc2.type = "sine";
          this.osc2.frequency.setValueAtTime(freq * 2, now);

          this.osc2Gain = ctx.createGain();
          this.osc2Gain.gain.setValueAtTime(AUDIO.harmonicGain, now);
          this.osc2.connect(this.osc2Gain);

          this.lfo = ctx.createOscillator();
          this.lfo.frequency.setValueAtTime(AUDIO.vibratoRate, now);
          this.lfoGain = ctx.createGain();
          this.lfoGain.gain.setValueAtTime(freq * AUDIO.vibratoDepthRatio, now);
          this.lfo.connect(this.lfoGain);
          this.lfoGain.connect(this.osc1.frequency);
          this.lfoGain.connect(this.osc2.frequency);

          this.noise = ctx.createBufferSource();
          this.noise.buffer = noiseBuffer;
          this.noise.loop = true;

          this.noiseFilter = ctx.createBiquadFilter();
          this.noiseFilter.type = "bandpass";
          this.noiseFilter.frequency.setValueAtTime(freq * AUDIO.noiseFilterRatio, now);
          this.noiseFilter.Q.setValueAtTime(AUDIO.noiseFilterQ, now);

          this.noiseGain = ctx.createGain();
          this.noiseGain.gain.setValueAtTime(AUDIO.noiseGain, now);
          this.noise.connect(this.noiseFilter);
          this.noiseFilter.connect(this.noiseGain);

          this.env = ctx.createGain();
          this.env.gain.setValueAtTime(0, now);
          this.env.gain.linearRampToValueAtTime(AUDIO.envPeak, now + AUDIO.envAttack);

          this.osc1.connect(this.env);
          this.osc2Gain.connect(this.env);
          this.noiseGain.connect(this.env);
          this.env.connect(masterGain);

          this._nodes = [this.osc1, this.osc2, this.osc2Gain, this.lfo, this.lfoGain, this.noise, this.noiseFilter, this.noiseGain, this.env];

          this.osc1.start(now);
          this.osc2.start(now);
          this.lfo.start(now);
          this.noise.start(now);
        }

        stop(fast) {
          if (this.stopped) return; // idempotent
          this.stopped = true;
          if (!ctx) return;
          const now = ctx.currentTime;
          const release = fast ? AUDIO.envReleaseFast : AUDIO.envRelease;
          try {
            this.env.gain.cancelScheduledValues(now);
            this.env.gain.setValueAtTime(this.env.gain.value, now);
            this.env.gain.linearRampToValueAtTime(0.001, now + release);
          } catch (e) {
            console.warn("[Digital Flute] envelope stop failed", e);
          }
          // If scheduled in the future, wait until after its start + release.
          const waitForStart = Math.max(0, this._startTime - now);
          this._cleanupTimer = setTimeout(() => this._disconnectAll(), (waitForStart + release) * 1000 + 20);
        }

        _disconnectAll() {
          if (this._disconnected) return;
          this._disconnected = true;
          // Stop oscillators/sources first, then disconnect every node.
          [this.osc1, this.osc2, this.lfo, this.noise].forEach((n) => {
            try { n.stop(); } catch (e) { /* already stopped */ }
          });
          this._nodes.forEach((n) => {
            try { n.disconnect(); } catch (e) { console.warn("[Digital Flute] disconnect failed", e); }
          });
        }
      }

      // --- State ---
      // hole -> { voice, pointers:Set<pointerId> }  (ref-counted for multi-touch)
      const holeState = new Map();
      // pointerId -> hole
      const pointerToHole = new Map();

      let currentPreset = "free";
      let tracker = createSongTracker([]);
      let isDemoPlaying = false;
      let demoTimeouts = [];
      let demoVoices = [];
      let wrongUntil = 0;
      let wrongTimer = null;
      let completeTimer = null;

      function setStatus(parts) {
        statusText.textContent = "";
        parts.forEach((p) => {
          if (typeof p === "string") {
            statusText.appendChild(document.createTextNode(p));
          } else {
            const s = document.createElement("strong");
            s.textContent = p.strong;
            statusText.appendChild(s);
            if (p.after) statusText.appendChild(document.createTextNode(p.after));
          }
        });
      }

      function updateStatus() {
        holes.forEach((h) => h.classList.remove("target"));

        if (currentPreset === "free") {
          statusText.classList.add("free");
          statusText.classList.remove("wrong");
          songControls.classList.remove("visible");
          const activeNotes = Array.from(holeState.keys()).map((h) => h.dataset.note);
          if (activeNotes.length > 0) setStatus([{ strong: activeNotes.join(" "), after: "" }]);
          else statusText.textContent = "Free Play";
          return;
        }

        statusText.classList.remove("free");
        songControls.classList.add("visible");

        if (tracker.isComplete()) {
          statusText.classList.remove("wrong");
          setStatus([{ strong: "Done", after: " Song completed — restarting…" }]);
          return;
        }

        const item = tracker.current;
        if (Date.now() < wrongUntil) {
          statusText.classList.add("wrong");
          setStatus(["Wrong note — expected ", { strong: item.note, after: ` ${item.lyric}` }]);
        } else {
          statusText.classList.remove("wrong");
          setStatus(["Next: ", { strong: item.note, after: ` ${item.lyric}` }]);
        }

        if (!isDemoPlaying) {
          const targetHole = holes.find((h) => h.dataset.note === item.note);
          if (targetHole) targetHole.classList.add("target");
        }
      }

      function flashWrong() {
        wrongUntil = Date.now() + 900;
        updateStatus();
        clearTimeout(wrongTimer);
        wrongTimer = setTimeout(updateStatus, 950);
      }

      function handleNotePlayed(note) {
        if (currentPreset === "free") return;
        // Restart automatically if previous song was completed.
        if (tracker.isComplete()) {
          clearTimeout(completeTimer);
          tracker.reset();
        }
        const result = tracker.advance(note);
        if (result === "wrong") {
          flashWrong();
        } else if (result === "complete") {
          updateStatus();
          clearTimeout(completeTimer);
          completeTimer = setTimeout(() => {
            tracker.reset();
            updateStatus();
          }, 1800);
        }
      }

      async function playHole(hole, pointerId) {
        if (!hole || pointerId == null) return;
        if (pointerToHole.get(pointerId) === hole) return;

        // User input takes over from demo.
        if (isDemoPlaying) stopDemo();

        // Glissando: leave previous hole for this pointer.
        if (pointerToHole.has(pointerId)) stopHole(pointerId, true);

        pointerToHole.set(pointerId, hole);

        const existing = holeState.get(hole);
        if (existing) {
          existing.pointers.add(pointerId);
          hole.classList.add("pressed");
          updateStatus();
          return;
        }

        hole.classList.add("pressed");
        try {
          await ensureAudio();
        } catch (e) {
          console.error("[Digital Flute] audio unavailable", e);
          pointerToHole.delete(pointerId);
          hole.classList.remove("pressed");
          statusText.textContent = "Audio unavailable in this browser";
          return;
        }

        // Pointer was released while awaiting resume — do not orphan a voice.
        if (pointerToHole.get(pointerId) !== hole) return;

        const afterAwait = holeState.get(hole);
        if (afterAwait) {
          afterAwait.pointers.add(pointerId);
          return;
        }

        const voice = new FluteVoice(parseFloat(hole.dataset.freq));
        holeState.set(hole, { voice, pointers: new Set([pointerId]) });
        handleNotePlayed(hole.dataset.note);
        updateStatus();
      }

      function stopHole(pointerId, fast) {
        const hole = pointerToHole.get(pointerId);
        if (!hole) return;
        pointerToHole.delete(pointerId);
        const state = holeState.get(hole);
        if (!state) {
          // Voice not yet created (released while awaiting AudioContext resume).
          const stillHeld = Array.from(pointerToHole.values()).includes(hole);
          if (!stillHeld) hole.classList.remove("pressed");
          if (currentPreset === "free") updateStatus();
          return;
        }
        state.pointers.delete(pointerId);
        if (state.pointers.size === 0) {
          state.voice.stop(!!fast);
          holeState.delete(hole);
          hole.classList.remove("pressed");
        }
        if (currentPreset === "free") updateStatus();
      }

      function stopAllHoles() {
        for (const pid of Array.from(pointerToHole.keys())) stopHole(pid, true);
        for (const [hole, state] of Array.from(holeState.entries())) {
          state.voice.stop(true);
          holeState.delete(hole);
          hole.classList.remove("pressed");
        }
      }

      function findHole(x, y, target) {
        if (target && target.closest) {
          const h = target.closest(".hole");
          if (h) return h;
        }
        const el = document.elementFromPoint(x, y);
        return el ? el.closest(".hole") : null;
      }

      fluteEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        try { fluteEl.setPointerCapture(e.pointerId); } catch (err) { console.warn("[Digital Flute] setPointerCapture failed", err); }
        const hole = findHole(e.clientX, e.clientY, e.target);
        if (hole) playHole(hole, e.pointerId);
      });

      fluteEl.addEventListener("pointermove", (e) => {
        e.preventDefault();
        if (!pointerToHole.has(e.pointerId)) return;
        const hole = findHole(e.clientX, e.clientY, e.target);
        if (hole && hole !== pointerToHole.get(e.pointerId)) {
          playHole(hole, e.pointerId);
        } else if (!hole) {
          stopHole(e.pointerId, true);
        }
      });

      fluteEl.addEventListener("contextmenu", (e) => e.preventDefault());

      window.addEventListener("pointerup", (e) => stopHole(e.pointerId));
      window.addEventListener("pointercancel", (e) => stopHole(e.pointerId));
      // Panic stop: never leave a drone behind.
      window.addEventListener("blur", () => { stopAllHoles(); stopDemo(); });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) { stopAllHoles(); stopDemo(); }
      });

      // Keyboard: letters + Space/Enter on focused hole.
      window.addEventListener("keydown", (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.target && e.target.matches && e.target.matches("select, input, textarea")) return;
        const note = NOTE_FOR_KEY[e.key.toLowerCase()];
        if (!note) return;
        const hole = holes.find((h) => h.dataset.note === note);
        if (hole) {
          e.preventDefault();
          playHole(hole, `keyboard-${e.key.toLowerCase()}`);
        }
      });
      window.addEventListener("keyup", (e) => {
        const note = NOTE_FOR_KEY[e.key.toLowerCase()];
        if (note) stopHole(`keyboard-${e.key.toLowerCase()}`);
      });
      holes.forEach((hole) => {
        const pid = `key-${hole.dataset.note}`;
        hole.addEventListener("keydown", (e) => {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            playHole(hole, pid);
          }
        });
        hole.addEventListener("keyup", (e) => {
          if (e.key === " " || e.key === "Enter") stopHole(pid);
        });
        // Prevent button click from double-triggering after Space/Enter.
        hole.addEventListener("click", (e) => e.preventDefault());
      });

      // --- Demo (scheduled on the audio clock) ---
      function stopDemo() {
        demoTimeouts.forEach((t) => clearTimeout(t));
        demoTimeouts = [];
        demoVoices.forEach((v) => v.stop(true));
        demoVoices = [];
        holes.forEach((h) => { if (!holeState.has(h)) h.classList.remove("pressed"); });
        isDemoPlaying = false;
        demoBtn.classList.remove("active");
        demoBtn.textContent = "Demo";
      }

      async function toggleDemo() {
        if (isDemoPlaying) {
          stopDemo();
          updateStatus();
          return;
        }
        const song = SONGS[currentPreset];
        if (!song) return;
        try {
          await ensureAudio();
        } catch (e) {
          console.error("[Digital Flute] audio unavailable", e);
          statusText.textContent = "Audio unavailable in this browser";
          return;
        }
        stopDemo();
        isDemoPlaying = true;
        demoBtn.classList.add("active");
        demoBtn.textContent = "Stop";
        holes.forEach((h) => h.classList.remove("target"));

        const startTime = ctx.currentTime + 0.15;
        let offsetMs = 0;

        song.forEach((item) => {
          const noteStart = startTime + offsetMs / 1000;
          const hole = holes.find((h) => h.dataset.note === item.note);
          const freq = hole ? parseFloat(hole.dataset.freq) : window.FluteCore.NOTE_MAP[item.note];

          // Audio is scheduled precisely; UI follows the audio clock.
          const voice = new FluteVoice(freq, noteStart);
          demoVoices.push(voice);

          const uiDelay = Math.max(0, (noteStart - ctx.currentTime) * 1000);
          demoTimeouts.push(setTimeout(() => {
            setStatus(["Demo: ", { strong: item.note, after: ` ${item.lyric}` }]);
            if (hole && !holeState.has(hole)) hole.classList.add("pressed");
          }, uiDelay));

          const stopDelay = Math.max(0, (noteStart + (item.dur * 0.85) / 1000 - ctx.currentTime) * 1000);
          demoTimeouts.push(setTimeout(() => {
            voice.stop();
            if (hole && !holeState.has(hole)) hole.classList.remove("pressed");
            const idx = demoVoices.indexOf(voice);
            if (idx >= 0) demoVoices.splice(idx, 1);
          }, stopDelay));

          offsetMs += item.dur;
        });

        const endDelay = Math.max(0, (startTime + offsetMs / 1000 + 0.35 - ctx.currentTime) * 1000);
        demoTimeouts.push(setTimeout(() => {
          stopDemo();
          tracker.reset();
          updateStatus();
        }, endDelay));
      }

      // --- Controls ---
      songSelect.addEventListener("change", (e) => {
        stopDemo();
        stopAllHoles();
        clearTimeout(completeTimer);
        currentPreset = e.target.value;
        tracker = createSongTracker(SONGS[currentPreset] || []);
        updateStatus();
      });

      demoBtn.addEventListener("click", toggleDemo);

      resetBtn.addEventListener("click", () => {
        stopDemo();
        clearTimeout(completeTimer);
        tracker.reset();
        updateStatus();
      });

      volumeInput.addEventListener("input", (e) => {
        volume = Number(e.target.value) / 100;
        if (masterGain && ctx) masterGain.gain.setValueAtTime(volume, ctx.currentTime);
      });

      updateStatus();
    </script>
  </body>
</html>
